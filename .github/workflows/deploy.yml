name: Deploy website to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ['main']
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Check deployment configuration
  config:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    outputs:
      deploy-host: ${{ steps.check.outputs.host }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: hugoblox.yaml
        sparse-checkout-cone-mode: false

    - name: Check deploy host
      id: check
      run: |
        # Read deploy.host from hugoblox.yaml without downloading extra tools.
        HOST=$(python3 - <<'PY'
        import re
        from pathlib import Path

        section = None
        host = ""
        for raw_line in Path("hugoblox.yaml").read_text().splitlines():
            line = raw_line.split("#", 1)[0].rstrip()
            if not line.strip():
                continue
            if not raw_line.startswith((" ", "\t")):
                section = line.rstrip(":")
                continue
            if section == "deploy":
                match = re.match(r"\s*host:\s*['\"]?([^'\"]+)['\"]?\s*$", line)
                if match:
                    host = match.group(1).strip()
                    break
        print(host)
        PY
        )
        HOST=${HOST:-github-pages}

        # Validate known hosts
        if [[ ! "$HOST" =~ ^(github-pages|netlify|vercel|cloudflare|none)$ ]]; then
          echo "::warning::Unknown deploy host '$HOST', defaulting to github-pages"
          HOST="github-pages"
        fi

        echo "host=$HOST" >> $GITHUB_OUTPUT
        echo "Deployment target: $HOST"

  # Build website using reusable workflow (always runs for CI)
  build:
    needs: config
    if: github.repository_owner != 'HugoBlox'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Deploy website to GitHub Pages hosting (only if configured)
  deploy:
    needs: [config, build]
    if: needs.config.outputs.deploy-host == 'github-pages'
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
